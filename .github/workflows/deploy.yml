name: Deploy Marketing

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -eu

            cd /var/www/odra_marketing

            tracked_envs="$(git ls-files -- Backend/.env Frontend/.env)"
            if [ -n "$tracked_envs" ]; then
              echo "Refusing to deploy: VPS .env files must not be tracked by Git."
              exit 1
            fi

            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin main

            if [ -n "$(git ls-tree -r --name-only origin/main -- Backend/.env Frontend/.env)" ]; then
              echo "Refusing to deploy: origin/main contains a VPS .env file."
              exit 1
            fi

            git merge --ff-only origin/main

            cd Frontend
            npm ci
            npm run build

            cd ../Backend
            npm ci
            sudo -n pm2 restart odra-marketing-backend --update-env
